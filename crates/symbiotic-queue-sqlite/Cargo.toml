[package]
name = "symbiotic-queue-sqlite"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Local SQLite backend for the symbiotic-queue contracts"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
hex.workspace = true
rusqlite.workspace = true
symbiotic-core = { path = "../symbiotic-core" }
symbiotic-queue = { path = "../symbiotic-queue" }
tokio.workspace = true

[dev-dependencies]
rusqlite = { workspace = true, features = ["hooks"] }
symbiotic-queue = { path = "../symbiotic-queue", features = ["conformance"] }
futures = "0.3"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
