[package]
name = "symbiotic-ai-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Stateful AI provider runtime: hands out ready queued providers and owns their persistence"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde.workspace = true
rusqlite.workspace = true
symbiotic-core = { path = "../symbiotic-core" }
symbiotic-model = { path = "../symbiotic-model" }
symbiotic-queue = { path = "../symbiotic-queue" }
# The persistent backend. `symbiotic-ai-runtime`, `symbiotic-queue-sqlite` and
# `symbiotic-credential-process` link SQLite; the model/queue contracts do not.
symbiotic-queue-sqlite = { path = "../symbiotic-queue-sqlite" }
symbiotic-trace = { path = "../symbiotic-trace" }
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rusqlite = { workspace = true, features = ["hooks"] }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
tempfile = "3"
