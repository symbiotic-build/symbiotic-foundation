[package]
name = "symbiotic-credential-process"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Credential-owning local model dispatch process"

[dependencies]
async-trait.workspace = true
base64 = "0.22"
libc = "0.2"
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2 = "0.6"
symbiotic-ai-runtime = { path = "../symbiotic-ai-runtime" }
chrono.workspace = true
symbiotic-queue = { path = "../symbiotic-queue" }
symbiotic-supervise = { path = "../symbiotic-supervise" }
symbiotic-egress = { path = "../symbiotic-egress" }
symbiotic-trace = { path = "../symbiotic-trace" }
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
uuid.workspace = true
zeroize = "1"

[dev-dependencies]
symbiotic-queue-sqlite = { path = "../symbiotic-queue-sqlite" }
rusqlite = { workspace = true, features = ["hooks"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
