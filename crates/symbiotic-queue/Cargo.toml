[package]
name = "symbiotic-queue"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-neutral durable queue contracts"

[features]
# The shared `QueueBackend` conformance checks (`conformance` module and the
# `queue_backend_conformance!` macro), for backend crates' tests.
conformance = []

[dependencies]
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
symbiotic-core = { path = "../symbiotic-core" }
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
futures = "0.3"
tempfile = "3"
