[package]
name = "symbiotic-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tiny shared vocabulary for Symbiotic foundation crates"

[features]
logging = ["dep:tracing", "dep:tracing-subscriber"]
# JSON schemas of the contract types; tests/schemas.rs writes and checks schemas/*.json.
schema = ["dep:schemars"]

[dependencies]
httpdate = "1"
schemars = { version = "1.2", optional = true }
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "std"], optional = true }

[dev-dependencies]
serde_json.workspace = true
