[workspace]
members = [
    "crates/symbiotic-supervise",
    "crates/symbiotic-egress",
    "crates/symbiotic-credential-process",
    "crates/symbiotic-ai-runtime",
    "crates/symbiotic-core",
    "crates/symbiotic-queue",
    "crates/symbiotic-queue-sqlite",
    "crates/symbiotic-model",
    "crates/symbiotic-trace",
    "crates/symbiotic-portability",
]
resolver = "2"

[workspace.package]
# 0.2.x: distinct from the runtime's same-named `symbiotic-core` / `symbiotic-queue`
# (0.1.0) so both can coexist in the runtime lockfile. Crate map: docs/ARCHITECTURE.md.
version = "0.2.0"
edition = "2024"
authors = ["Symbiotic Contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/symbiotic-ai/symbiotic-foundation"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
# Aligned with the symbiotic runtime (0.37 / libsqlite3-sys 0.35) so a single
# `links = "sqlite3"` native lib exists when the memory kit + foundation are
# path-linked into the runtime. Storage scope follows
# docs/architecture/boundary.md#storage-and-credentials.
rusqlite = { version = "0.37", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# Without the `attributes` proc macros: the facade and its macros only.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Every reqwest client parses the system root bundle through this crate. Unoptimized,
# that parse took most of the egress tests' CPU (12.75 s → 4.23 s on the build host).
[profile.dev.package.rustls-pki-types]
opt-level = 3
