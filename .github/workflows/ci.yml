name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The toolchain comes from rust-toolchain.toml (dated nightly).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-25
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # One package per command: features unify across the packages of one
      # invocation, which would re-enable a default under test.
      - name: Clippy (symbiotic-model without default features)
        run: cargo clippy -p symbiotic-model --no-default-features --all-targets --locked -- -D warnings
      - name: Test (production request-debug refusal)
        run: cargo test --release --locked -p symbiotic-ai-runtime --test runtime production_request_debug_dir_is_refused_at_bind_time -- --exact
      - name: Test (default features)
        run: cargo test --workspace --locked
      # Keep workspace dev features out of the executable's provider-cost regression.
      - name: Test (credential executable production features)
        run: cargo test --locked -p symbiotic-credential-process --test egress executable_preserves_numeric_provider_cost_after_restart -- --exact
      - name: Test (symbiotic-model without default features)
        run: cargo test -p symbiotic-model --no-default-features --locked
      # The in-process backend runs the shared conformance checks; the SQLite
      # backend runs them through its dev-dependency on the feature.
      - name: Test (queue backend conformance)
        run: cargo test -p symbiotic-queue --features conformance --locked
